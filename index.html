/* Cinema opening on desktop; one combined composition on mobile. */
.experience{background:#050505}
.teaser-section{width:100%;min-height:100svh;padding:80px 6% 45px;display:flex;flex-direction:column;justify-content:center;align-items:center;margin:0}
.video-frame{width:min(100%,1440px);border:0}
.video-frame video{max-height:calc(100svh - 125px);object-fit:contain}
.video-error{width:min(100%,1440px)}
.hero .actions .button{min-width:265px}
@media(max-width:760px){
 .experience{position:relative;isolation:isolate;min-height:calc(100svh - 82px);display:flex;flex-direction:column;justify-content:center;padding:74px 0 42px;background:linear-gradient(180deg,#050505 0%,#110d0b22 40%,#110d0bdb 100%),url('./bandera.webp') center/cover no-repeat}
 .teaser-section{order:0;min-height:0;width:100%;padding:0;margin:0}
 .video-frame{width:100%;border:0}
 .video-frame video{width:100%;height:auto;max-height:none;aspect-ratio:16/9}
 .video-error{width:88%;margin:14px auto 0}
 .hero{display:contents}
 .hero:before,.hero-image{display:none}
 .hero-content{width:88%;padding:0;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
 .hero-bottom,.hero-bottom>div{display:contents}
 .actions{order:0;justify-content:center;width:100%;margin:24px 0 32px}
 .hero .actions .button{justify-content:center;min-width:0;width:min(100%,360px);gap:22px;min-height:56px}
 h1{order:1;font-size:clamp(78px,22vw,160px);line-height:.95;margin:0 0 16px;max-width:100%}
 .release{order:2}

}
@media(max-width:380px){.experience{padding-top:66px}.actions{margin:20px 0 26px}h1{font-size:22vw}}


[hidden]{display:none!important}
.release-live .hero{height:auto;min-height:0;max-height:none}
.release-live .hero-image{background-position:center 38%}

.platforms{display:flex;flex-wrap:wrap;gap:10px}

.platforms .button.primary{background:var(--paper)}
.platforms .button:hover{background:white;color:#111}

 .release-live .experience{display:block;padding:0;min-height:0;background:#110d0b}

<body>
<a href="#contenido" class="skip">Ir al contenido</a>

<main id="contenido"><div class="experience">
<section class="teaser-section wrap" id="teaser" aria-label="Teaser de Argentina 2077"><h2 class="teaser-title" hidden>Teaser oficial</h2><div class="video-frame"><video controls playsinline preload="metadata" poster="./teaser-poster.jpg" aria-label="Video de Argentina 2077"><source src="./teaser.mp4" type="video/mp4">Tu navegador no puede reproducir este video. <a href="./teaser.mp4">Abrir el teaser</a>.</video></div><p id="video-error" class="video-error" hidden>No se pudo cargar el video. <a href="./teaser.mp4" target="_blank" rel="noopener">Abrir el teaser ↗</a></p></section>
<section id="reserva" class="hero" aria-labelledby="titulo"><div class="hero-image" role="img" aria-label="Bandera roja y negra de Argentina 2077 con sol sin pupilas entre humo y brasas"></div><div class="hero-content wrap"><h1 id="titulo">ARGENTINA <span class="year">2077</span></h1><div class="hero-bottom"><div><div class="release" id="release-label"><strong>20 . 11 . 2026</strong></div><div class="actions" id="presave"><a class="button primary presave" href="https://open.spotify.com/album/42sNjjAKG0LVpT2lwMSNp6" target="_blank" rel="noopener noreferrer">Preguardar en Spotify <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a></div>
<div class="listen-panel" id="escuchar" hidden>
  <p class="release"><strong>Capítulo I</strong></p>
  <h2 id="listen-heading">Escuchá el EP</h2>
  <nav class="platforms" aria-labelledby="listen-heading">
    <a class="button primary" href="https://open.spotify.com/album/42sNjjAKG0LVpT2lwMSNp6">Spotify</a>
  </nav>
</div>
</div></div></div></section>
</div></main>
<footer><div class="wrap footer-inner"><a href="https://chebrolet.com.ar/" class="brand">CHEBROLET</a><nav aria-label="Redes"><a href="https://www.instagram.com/akachebrolet" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://www.youtube.com/@chebrolet" target="_blank" rel="noopener noreferrer">YouTube</a></nav></div></footer>
<script>
const listenAt = Date.parse('2026-11-20T00:05:00-03:00');
let releaseTimer;

async function loadPlatformLinks() {
  try {
    const response = await fetch('./plataformas.json', { cache: 'no-cache' });
    if (!response.ok) return;
    const links = await response.json();
    if (!Array.isArray(links)) return;

    const buttons = links
      .filter(link => typeof link?.name === 'string' && link.name.trim() &&
        typeof link.url === 'string' && /^https:\/\//i.test(link.url))
      .map(({ name, url }) => {
        const button = document.createElement('a');
        button.className = 'button';
        button.href = url;
        button.textContent = name;
        return button;
      });
    document.querySelector('.platforms').append(...buttons);
  } catch {
    // Spotify remains available if the additional platform list cannot be loaded.
  }
}

function showRelease() {
  clearTimeout(releaseTimer);
  if (document.body.classList.contains('release-live')) return;

  const remaining = listenAt - Date.now();
  if (remaining > 0) {
    releaseTimer = setTimeout(showRelease, Math.min(remaining, 2_147_483_647));
    return;
  }

  const hero = document.querySelector('.hero');
  const teaser = document.getElementById('teaser');
  teaser.before(hero);
  document.getElementById('release-label').hidden = true;
  document.getElementById('presave').hidden = true;
  document.getElementById('escuchar').hidden = false;
  teaser.querySelector('.teaser-title').hidden = false;
  document.body.classList.add('release-live');
  loadPlatformLinks();
}

document.addEventListener('visibilitychange', showRelease);
window.addEventListener('pageshow', showRelease);
showRelease();

const video=document.querySelector('video');
const showVideoError=()=>{document.getElementById('video-error').hidden=false;};
video.addEventListener('error',showVideoError);
video.querySelector('source').addEventListener('error',showVideoError);
</script>
</body></html>
